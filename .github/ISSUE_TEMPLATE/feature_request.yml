name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 当前在…场景下，缺少…能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的做法（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
